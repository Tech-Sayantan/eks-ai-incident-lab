name: Apply ECR repositories

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: lab-terraform
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      TF_VAR_expected_account_id: "923988301700"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.7"
          terraform_wrapper: false

      - name: Assume AWS apply role
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::923988301700:role/eks-ai-incident-lab-gha-apply
          aws-region: ap-south-1
          allowed-account-ids: "923988301700"

      - name: Initialize lab backend
        run: terraform -chdir=infra/live/lab init -input=false -no-color

      - name: Save a fresh plan
        run: terraform -chdir=infra/live/lab plan -input=false -no-color -lock-timeout=60s -out=ecr.tfplan

      - name: Allow only the two ECR creations
        run: |
          set -euo pipefail
          terraform -chdir=infra/live/lab show -json ecr.tfplan |
            jq -e '
              [.resource_changes[]
                | select(.mode == "managed" and .change.actions != ["no-op"])]
              | sort_by(.address)
              | map({address, actions: .change.actions})
              == [
                {"address": "aws_ecr_repository.app[\"orders-api\"]", "actions": ["create"]},
                {"address": "aws_ecr_repository.app[\"payment-simulator\"]", "actions": ["create"]}
              ]
            '

      - name: Apply the checked plan
        run: terraform -chdir=infra/live/lab apply -input=false -no-color ecr.tfplan

      - name: Verify repositories
        run: |
          aws ecr describe-repositories \
            --repository-names \
              eks-ai-incident-lab/orders-api \
              eks-ai-incident-lab/payment-simulator \
            --query 'repositories[].{name:repositoryName,url:repositoryUri}' \
            --output table