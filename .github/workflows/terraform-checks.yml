name: Terraform checks

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform-checks.yml"
      - ".github/workflows/network-plan.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.7"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra

      - name: Initialize bootstrap providers without remote state
        working-directory: infra/bootstrap
        run: terraform init -backend=false -input=false

      - name: Validate bootstrap Terraform
        working-directory: infra/bootstrap
        run: terraform validate -no-color

      - name: Initialize lab providers without remote state
        working-directory: infra/live/lab
        run: terraform init -backend=false -input=false

      - name: Validate lab Terraform
        working-directory: infra/live/lab
        run: terraform validate -no-color

      - name: Scan Terraform configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          severity: HIGH,CRITICAL
          exit-code: "1"
          hide-progress: true