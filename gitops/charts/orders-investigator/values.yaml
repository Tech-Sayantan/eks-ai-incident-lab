image:
  repository: 923988301700.dkr.ecr.ap-south-1.amazonaws.com/eks-ai-incident-lab/orders-investigator
  digest: "sha256:ae7ee5397f56f88bc6aa3e50e64bdf4cbebb0b4cf074adc00cf77f2ad9545564"

awsRegion: ap-south-1

workloads:
  orders-investigator:
    port: 8080
    healthPath: /healthz
    command: ["uvicorn", "investigator_api:app", "--host", "0.0.0.0", "--port", "8080"]
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 600m, memory: 768Mi }
  orders-mcp:
    port: 8765
    command: ["python", "orders_mcp_server.py", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8765"]
    resources:
      requests: { cpu: 40m, memory: 64Mi }
      limits: { cpu: 250m, memory: 256Mi }
  payment-agent:
    port: 8080
    healthPath: /healthz
    command: ["uvicorn", "payment_agent:app", "--host", "0.0.0.0", "--port", "8080"]
    resources:
      requests: { cpu: 40m, memory: 64Mi }
      limits: { cpu: 250m, memory: 256Mi }

qdrant:
  image: qdrant/qdrant:v1.19.2@sha256:b7b0444c4c351c970b98e90a6f89c2ee4287c65b44e52b4cb503fa5b2aa927ad
  port: 6333
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 250m, memory: 512Mi }
